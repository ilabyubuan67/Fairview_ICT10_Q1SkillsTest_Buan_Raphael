<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tokyo Ramen</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("https://images.unsplash.com/photo-1522895788996-7feeec6f467b?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8amFwYW4lMjB0cmVlfGVufDB8fDB8fHww");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-danger">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Tokyo Ramen</a>

        <div>
            <a class="text-white me-3" href="#">Home</a>
            <a class="text-white me-3" href="#">Menu</a>
            <a class="text-white" href="#">About</a>
        </div>
    </div>
</nav>

<div class="container bg-light p-4 mt-5 w-50 rounded shadow">

    <h3>Ramen Menu</h3>

    <div class="mt-3">

        <input type="checkbox" id="shoyu_ramen" value="180">
        <label>Shoyu Ramen - ₱180</label>
        <br>

        <input type="checkbox" id="miso_ramen" value="200">
        <label>Miso Ramen - ₱200</label>
        <br>

        <input type="checkbox" id="tonkotsu_ramen" value="220">
        <label>Tonkotsu Ramen - ₱220</label>
        <br>

        <input type="checkbox" id="spicy_ramen" value="190">
        <label>Spicy Ramen - ₱190</label>
        <br><br>

        <input type="button"
               py-click="calculate_total"
               value="Order"
               class="btn btn-danger">

    </div>

    <div id="receipt" class="mt-3"></div>

</div>

<script type="py" src="main.py"></script>

</body>
</html>
